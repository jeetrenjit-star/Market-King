      "tip": "An advantage rivals can replicate overnight isn't an advantage. Build on things hard to imitate \u2014 relationships, brand, proprietary process.",
      "takeaway": "If a competitor can copy it by Friday, it was never your advantage."
    },
    {
      "id": "0431",
      "source": "Competitive Strategy",
      "category": "Competitive Cost Structure",
      "title": "Understand rivals' cost structure",
      "tip": "Knowing how competitors make money reveals how low they can price and where they're vulnerable. Don't start a price war against a lower-cost rival.",
      "takeaway": "Never start a price war with someone whose costs are lower than yours."
    },
    {
      "id": "0432",
      "source": "Competitive Strategy",
      "category": "Market Share Reality",
      "title": "Measure real market share",
      "tip": "Estimate your actual share of the served market to know whether you're a leader, challenger, or niche player \u2014 and strategize accordingly.",
      "takeaway": "Strategy depends on whether you're the lion, the wolf, or the fox. Know which you are."
    },
    {
      "id": "0433",
      "source": "Competitive Strategy",
      "category": "Challenger Strategy",
      "title": "Play the challenger's game",
      "tip": "If you're not the leader, don't imitate them \u2014 attack their weaknesses and reframe the comparison. Challengers win by changing the rules.",
      "takeaway": "Challengers never win by playing the leader's game. Change the rules."
    },
    {
      "id": "0434",
      "source": "Competitive Strategy",
      "category": "Leader Strategy",
      "title": "If you lead, defend broadly",
      "tip": "Market leaders win by covering the field and responding to threats early, not by chasing every challenger's niche. Protect the core.",
      "takeaway": "Leaders lose by ignoring small threats until they're big ones. Defend early."
    },
    {
      "id": "0435",
      "source": "Competitive Strategy",
      "category": "Competitive Timing",
      "title": "Time your moves to competitor cycles",
      "tip": "Launch and promotion timing relative to competitors' cycles can decide impact. Move when rivals are quiet or distracted.",
      "takeaway": "The right move at the wrong moment fails. Time it against the competition."
    },
    {
      "id": "0436",
      "source": "Competitive Strategy",
      "category": "Positioning Consistency",
      "title": "Hold your position consistently",
      "tip": "A position is built through consistent repetition. Lurching between positions confuses the market and cedes ground.",
      "takeaway": "A position changed often is a position never held. Commit."
    },
    {
      "id": "0437",
      "source": "Competitive Strategy",
      "category": "Substitute Conversion",
      "title": "Convert from the substitute, not just rivals",
      "tip": "Often your biggest growth comes from people using a workaround or doing nothing, not from competitors' customers. Target the substitute users.",
      "takeaway": "Your next customers may not be using a rival \u2014 they may be using nothing. Convert them."
    },
    {
      "id": "0438",
      "source": "Competitive Strategy",
      "category": "Competitive Differentiator Test",
      "title": "Test the differentiator with customers",
      "tip": "Validate that your claimed difference actually influences customer choice. A differentiator customers don't value is a vanity, not a strategy.",
      "takeaway": "If customers don't choose because of your difference, it isn't a differentiator."
    },
    {
      "id": "0439",
      "source": "Competitive Strategy",
      "category": "Reputation Moat",
      "title": "Treat reputation as a competitive moat",
      "tip": "A strong reputation is hard to copy and slow to build, making it a durable advantage. Protect it as a strategic asset.",
      "takeaway": "Reputation is the one moat money can't quickly buy and competitors can't quickly cross."
    },
    {
      "id": "0440",
      "source": "Competitive Strategy",
      "category": "Competitive Agility",
      "title": "Out-maneuver larger rivals with speed",
      "tip": "Smaller players can win by responding faster than slow incumbents. Turn agility into your competitive weapon.",
      "takeaway": "You can't outspend the giant, but you can out-maneuver it. Speed is your edge."
    },
    {
      "id": "0441",
      "source": "Competitive Strategy",
      "category": "Bundling Defense",
      "title": "Use bundling to blunt comparison",
      "tip": "Bundling makes direct price comparison with competitors harder and raises perceived value. It's both an offense and a defense.",
      "takeaway": "A bundle is hard to price-compare. Use it to escape the comparison trap."
    },
    {
      "id": "0442",
      "source": "Competitive Strategy",
      "category": "Competitive Storytelling",
      "title": "Tell a better story than the category",
      "tip": "Often the winner isn't the best product but the best-told story. Out-narrate the category, not just out-feature it.",
      "takeaway": "In a tie on features, the better story wins. Tell yours."
    },
    {
      "id": "0443",
      "source": "Competitive Strategy",
      "category": "Exit Barriers",
      "title": "Recognize high exit barriers fuel rivalry",
      "tip": "When competitors can't easily leave a market, they fight harder and discount deeper. High exit barriers mean brutal rivalry \u2014 price accordingly.",
      "takeaway": "When rivals can't leave, they fight to the death. Expect a brawl."
    },
    {
      "id": "0444",
      "source": "Competitive Strategy",
      "category": "Competitive Focus",
      "title": "Resist competing on everything",
      "tip": "Spreading effort to match rivals on every dimension dilutes your edge. Concede the unimportant battles to win the decisive ones.",
      "takeaway": "Lose the battles that don't matter so you can win the one that does."
    },
    {
      "id": "0445",
      "source": "Competitive Strategy",
      "category": "Imitation Response",
      "title": "Respond when competitors copy you",
      "tip": "When rivals imitate your move, either accelerate ahead or shift to a new differentiator. Standing still lets the copy catch up.",
      "takeaway": "When they copy you, move again. A stationary innovator gets caught."
    },
    {
      "id": "0446",
      "source": "Competitive Strategy",
      "category": "Value Curve",
      "title": "Map your value curve against rivals",
      "tip": "Chart how you and competitors deliver across the factors customers value. Diverging sharply from the industry curve reveals your distinct position.",
      "takeaway": "Where your value curve breaks from the pack is where your position lives."
    },
    {
      "id": "0447",
      "source": "Competitive Strategy",
      "category": "Competitor Customer Pain",
      "title": "Mine competitor reviews for pain",
      "tip": "Negative reviews of competitors are a free list of unmet needs and acquisition angles. Read them systematically.",
      "takeaway": "Your competitor's one-star reviews are your product roadmap and ad copy."
    },
    {
      "id": "0448",
      "source": "Competitive Strategy",
      "category": "Positioning Against Nothing",
      "title": "Position against the do-nothing option",
      "tip": "Often the hardest competitor is inertia. Build a case specifically against doing nothing, not just against rival brands.",
      "takeaway": "Sometimes your toughest rival is the customer's couch. Sell against staying put."
    },
    {
      "id": "0449",
      "source": "Competitive Strategy",
      "category": "Strategic Patience",
      "title": "Don't react to every competitor move",
      "tip": "Not every rival action demands response. Reacting to noise wastes resources and cedes your strategy to their agenda.",
      "takeaway": "React to every competitor twitch and you let them run your strategy. Be still sometimes."
    },
    {
      "id": "0450",
      "source": "Competitive Strategy",
      "category": "Differentiation Sustainability",
      "title": "Plan how to sustain the difference",
      "tip": "Ask how you'll keep your advantage as competitors adapt. A differentiator with no plan to evolve has a short shelf life.",
      "takeaway": "Every advantage decays. Have a plan to renew yours before it fades."
    },
    {
      "id": "0451",
      "source": "Competitive Strategy",
      "category": "Competitive Scanning",
      "title": "Scan beyond your industry",
      "tip": "Threats and ideas often come from adjacent industries. Scan widely so you're not blindsided by a cross-over competitor.",
      "takeaway": "The disruptor often arrives from the industry next door. Watch the neighbors."
    },
    {
      "id": "0452",
      "source": "Competitive Strategy",
      "category": "Market Entry Timing",
      "title": "Choose entry timing deliberately",
      "tip": "Enter when the market is ready and rivals are vulnerable, not just when you're impatient. Timing shapes entry success as much as the offering.",
      "takeaway": "Right market, wrong time, still fails. Time the entry as carefully as you build the product."
    },
    {
      "id": "0453",
      "source": "Competitive Strategy",
      "category": "Competitive Benchmark Cadence",
      "title": "Benchmark on a fixed cadence",
      "tip": "Set a regular schedule to review competitors. Sporadic checks let rivals change the landscape while you're not looking.",
      "takeaway": "Benchmark on a schedule, or wake up one day in a market you don't recognize."
    },
    {
      "id": "0454",
      "source": "Competitive Strategy",
      "category": "Defensible Niche",
      "title": "Find a niche too small for giants",
      "tip": "A segment too small to interest large competitors can be highly profitable for a focused player. Hide in the giant's blind spot.",
      "takeaway": "The market too small for the giant can be the perfect size for you."
    },
    {
      "id": "0455",
      "source": "Competitive Strategy",
      "category": "Competitive Messaging",
      "title": "Differentiate the message, not just the product",
      "tip": "When products are similar, the brand with the clearest, most distinct message wins. Differentiate in words when you can't in features.",
      "takeaway": "When products tie, the sharper message breaks the deadlock."
    },
    {
      "id": "0456",
      "source": "Competitive Strategy",
      "category": "Anticipate Response",
      "title": "Game out the competitor's counter-move",

      "title": "Target keywords by intent",
      "tip": "Match content to whether searchers want to learn, compare, or buy. Ranking for the wrong intent brings traffic that never converts.",
      "takeaway": "Rank for what the searcher wants to do, not just what they typed."
    },
    {
      "id": "0603",
      "source": "Digital Strategy",
      "category": "Marketing Automation",
      "title": "Automate the repeatable, personalize the pivotal",
      "tip": "Use automation for scale and consistency, but keep human touch at high-trust moments. The blend beats either extreme.",
      "takeaway": "Automate the routine; humanize the decisive. Don't let robots handle the moments that matter."
    },
    {
      "id": "0604",
      "source": "Digital Strategy",
      "category": "Lead Nurture",
      "title": "Nurture leads, don't just capture them",
      "tip": "Most captured leads aren't ready to buy yet. A nurture sequence turns 'not now' into 'yes' over time.",
      "takeaway": "A captured lead unnurtured is a business card in a drawer. Follow up systematically."
    },
    {
      "id": "0605",
      "source": "Digital Strategy",
      "category": "Retargeting",
      "title": "Retarget warm audiences efficiently",
      "tip": "People who already engaged convert far cheaper than cold ones. Retargeting concentrates spend on the warmest prospects.",
      "takeaway": "The warmest audience converts cheapest. Don't forget to come back for them."
    },
    {
      "id": "0606",
      "source": "Digital Strategy",
      "category": "Conversion Optimization",
      "title": "Optimize conversion before buying more traffic",
      "tip": "Improving the conversion rate multiplies the value of all traffic. Fix the funnel before paying for more visitors.",
      "takeaway": "A better-converting page makes every existing visitor more valuable. Start there."
    },
    {
      "id": "0607",
      "source": "Digital Strategy",
      "category": "Landing Page Focus",
      "title": "Give each landing page one job",
      "tip": "A landing page with many goals achieves none. Strip it to a single offer and a single action.",
      "takeaway": "One page, one promise, one button. Choice kills conversion."
    },
    {
      "id": "0608",
      "source": "Digital Strategy",
      "category": "Message Match",
      "title": "Match landing page to the ad",
      "tip": "The page must deliver exactly what the ad promised, in the same words. A mismatch breaks trust and wastes the click.",
      "takeaway": "If the ad said X, the page must open with X. Mismatch wastes the click."
    },
    {
      "id": "0609",
      "source": "Digital Strategy",
      "category": "Mobile First",
      "title": "Design mobile-first",
      "tip": "Most traffic is mobile, especially in emerging markets. Design and test for the phone first, the desktop second.",
      "takeaway": "Your customer is on a phone. Design for the thumb, not the mouse."
    },
    {
      "id": "0610",
      "source": "Digital Strategy",
      "category": "Page Speed",
      "title": "Treat speed as conversion",
      "tip": "Slow pages lose visitors before they load, and data costs amplify this. Speed is a conversion factor, not a technical afterthought.",
      "takeaway": "Every second of load time is customers walking out the door. Speed is sales."
    },
    {
      "id": "0611",
      "source": "Digital Strategy",
      "category": "Personalization",
      "title": "Personalize by behavior, not just name",
      "tip": "Real personalization tailors content to what someone has done and wants. A name token is not personalization.",
      "takeaway": "Personalization is relevance, not a name in the greeting line."
    },
    {
      "id": "0612",
      "source": "Digital Strategy",
      "category": "Email Strategy",
      "title": "Treat email as the strategic backbone",
      "tip": "Email is owned, direct, and high-ROI. Build the list deliberately and make it the channel everything else feeds.",
      "takeaway": "Every other channel should feed the one you own. Build the list."
    },
    {
      "id": "0613",
      "source": "Digital Strategy",
      "category": "Lifecycle Marketing",
      "title": "Market across the customer lifecycle",
      "tip": "Different lifecycle stages need different messages \u2014 welcome, activate, grow, retain, win back. Map messaging to lifecycle stage.",
      "takeaway": "The message that wins a customer differs from the one that keeps them. Map the lifecycle."
    },
    {
      "id": "0614",
      "source": "Digital Strategy",
      "category": "Omnichannel",
      "title": "Make channels feel like one experience",
      "tip": "Customers move between channels expecting continuity. Stitch the experience so it feels like one brand, not disconnected silos.",
      "takeaway": "Customers see one brand; don't make them feel the seams between your channels."
    },
    {
      "id": "0615",
      "source": "Digital Strategy",
      "category": "Budget by Objective",
      "title": "Allocate budget by objective, not habit",
      "tip": "Distribute spend based on what each objective needs and returns, not on last year's split. Habitual budgets fossilize inefficiency.",
      "takeaway": "Last year's budget split is this year's hidden waste. Allocate to the objective."
    },
    {
      "id": "0616",
      "source": "Digital Strategy",
      "category": "Quick Wins",
      "title": "Bank quick wins to fund big bets",
      "tip": "Early, visible wins build momentum and credibility to invest in longer plays. Sequence quick wins before slow burners.",
      "takeaway": "Bank the quick wins first. They buy you the trust to chase the big ones."
    },
    {
      "id": "0617",
      "source": "Digital Strategy",
      "category": "Content Strategy",
      "title": "Build content around audience problems",
      "tip": "The most effective content solves real audience problems rather than broadcasting product features. Be useful and the audience comes.",
      "takeaway": "Useful content earns attention; promotional content begs for it. Be useful."
    },
    {
      "id": "0618",
      "source": "Digital Strategy",
      "category": "Distribution",
      "title": "Spend as much on distribution as creation",
      "tip": "Great content nobody sees is wasted. Plan distribution before creating, and invest in it as heavily as production.",
      "takeaway": "Don't spend all your energy making it and none making sure it's seen."
    },
    {
      "id": "0619",
      "source": "Digital Strategy",
      "category": "Conversion Tracking",
      "title": "Set up conversion tracking first",
      "tip": "Before spending on acquisition, ensure you can measure what converts. Spending without tracking is flying blind.",
      "takeaway": "Don't spend a shilling on traffic you can't measure. Track first."
    },
    {
      "id": "0620",
      "source": "Digital Strategy",
      "category": "Funnel Leaks",
      "title": "Find and fix funnel leaks",
      "tip": "Identify the stage with the biggest drop-off and fix it before optimizing anywhere else. The biggest leak deserves the first wrench.",
      "takeaway": "Fix the stage where most people leave before polishing the ones they don't."
    },
    {
      "id": "0621",
      "source": "Digital Strategy",
      "category": "Audience Building",
      "title": "Build audiences before you need them",
      "tip": "Grow an engaged audience ahead of launches so you have warm demand on day one. Building an audience during a launch is too late.",
      "takeaway": "Plant the audience before you need the harvest. Launches reward those who built early."
    },
    {
      "id": "0622",
      "source": "Digital Strategy",
      "category": "Value Ladder",
      "title": "Design a value ladder",
      "tip": "Offer a progression from free to entry to premium so customers can ascend as trust grows. A single high-price offer loses the cautious.",
      "takeaway": "Give customers a staircase, not a cliff. Let them ascend as trust builds."
    },
    {
      "id": "0623",
      "source": "Digital Strategy",
      "category": "Free Value",
      "title": "Lead with genuine free value",
      "tip": "Generosity up front builds trust and demonstrates competence. The free thing that truly helps earns the paid sale.",
      "takeaway": "Be useful before you're paid. Free value is the cheapest trust you'll ever buy."
    },
    {
      "id": "0624",
      "source": "Digital Strategy",
      "category": "Conversion Friction",
      "title": "Remove friction at every step",
      "tip": "Each extra field, click, or moment of confusion loses customers. Audit the path and remove every removable obstacle.",
      "takeaway": "Every extra step is a place to lose a customer. Remove all you can."
    },
    {
      "id": "0625",
      "source": "Digital Strategy",
      "category": "Social Proof Strategy",
      "title": "Build social proof into the strategy",
      "tip": "Plan how you'll collect and display proof systematically, not as an afterthought. Proof is a strategic asset, not decoration.",
      "takeaway": "Engineer the collection of proof from day one. It's strategy, not garnish."
    },
    {
      "id": "0626",
      "source": "Digital Strategy",
      "category": "Referral Strategy",
      "title": "Engineer referrals deliberately",
      "tip": "Word of mouth can be designed, not just hoped for. Build referral mechanics that make sharing easy and rewarding.",
      "takeaway": "Don't wait for word of mouth. Engineer it with mechanics that reward sharing."
    },
    {
      "id": "0627",
      "source": "Digital Strategy",
      "category": "Retention Strategy",
      "title": "Treat retention as a growth strategy",
      "tip": "Keeping customers is cheaper than acquiring them and compounds. Fund retention as deliberately as acquisition.",
      "takeaway": "Acquisition fills the bucket; retention stops the leak. Fund both."
    },
    {
      "id": "0628",
      "source": "Digital Strategy",
      "category": "Data Strategy",
      "title": "Collect data you'll actually use",
      "tip": "Gather the customer data that informs real decisions, not everything possible. Unused data is liability, not asset.",
      "takeaway": "Collect data for decisions you'll make, not for a dashboard you'll ignore."
    },
    {
      "id": "0629",
      "source": "Digital Strategy",
      "category": "Experimentation Culture",
      "title": "Build a culture of experimentation",
      "tip": "Make testing safe and routine so the organization learns continuously. Fear of failed tests kills the learning that drives growth.",
      "takeaway": "An organization afraid to fail a test is an organization that stops learning."
    },
    {
      "id": "0630",
      "source": "Digital Strategy",
      "category": "Channel Fit Strategy",
      "title": "Choose channels that fit your strengths",
      "tip": "Pick channels suited to your resources and content strengths. A channel you can't sustain well is worse than one you skip.",
      "takeaway": "Play to your strengths. A channel you can't sustain beats nothing only barely."
    },
    {
      "id": "0631",
      "source": "Digital Strategy",
      "category": "Positioning Strategy",
      "title": "Anchor digital strategy in positioning",
      "tip": "All tactics should reinforce a clear market position. Disconnected tactics blur the position you're trying to build.",
      "takeaway": "Every tactic should reinforce the position. Scattered tactics blur it."
    },
    {
      "id": "0632",
      "source": "Digital Strategy",
      "category": "Always-On vs Burst",
      "title": "Balance always-on and burst campaigns",
      "tip": "Steady always-on activity maintains presence; bursts drive moments. A healthy mix sustains attention and creates peaks.",
      "takeaway": "Maintain a steady drumbeat and punctuate it with the occasional bang."
    },
    {
      "id": "0633",
      "source": "Digital Strategy",
      "category": "Conversion Goal Clarity",
      "title": "Define the conversion explicitly",
      "tip": "Be precise about what action counts as success on each page and campaign. Vague conversion definitions produce vague optimization.",
      "takeaway": "Name the exact action that counts as a win, or you'll optimize toward nothing."
    },
    {
      "id": "0634",
      "source": "Digital Strategy",
      "category": "Audience Segmentation Strategy",
      "title": "Segment audiences for tailored journeys",
      "tip": "Different segments need different paths through the funnel. Build segment-specific journeys rather than one generic flow.",
      "takeaway": "One funnel for everyone fits no one well. Build paths per segment."
    },
    {
      "id": "0635",
      "source": "Digital Strategy",
      "category": "Brand-Performance Balance",
      "title": "Balance brand and performance marketing",
      "tip": "Performance marketing harvests demand; brand marketing creates it. Over-investing in harvest eventually starves the field.",
      "takeaway": "Pure performance marketing eventually runs out of demand to harvest. Feed the brand too."
    },
    {
      "id": "0636",
      "source": "Digital Strategy",
      "category": "Content Repurposing Strategy",
      "title": "Plan content repurposing into the strategy",
      "tip": "Build repurposing into the content plan so one asset serves many channels. It multiplies output without multiplying effort.",
      "takeaway": "Plan to repurpose from the start and one idea becomes a month of content."
    },
    {
      "id": "0637",
      "source": "Digital Strategy",
      "category": "Conversion Rate Benchmarks",
      "title": "Set realistic conversion benchmarks",
      "tip": "Base conversion expectations on your category and traffic source, not generic averages. Unrealistic benchmarks misjudge real performance.",
      "takeaway": "A realistic benchmark beats an aspirational one for judging what's actually working."
    },
    {
      "id": "0638",
      "source": "Digital Strategy",
      "category": "Lead Scoring",
      "title": "Score leads to focus effort",
      "tip": "Rank leads by fit and engagement so sales and nurture focus where conversion is likeliest. Treating all leads equally wastes effort.",
      "takeaway": "Not all leads deserve equal effort. Score them and focus where it pays."
    },
    {
      "id": "0639",
      "source": "Digital Strategy",
      "category": "Marketing-Sales Alignment",
      "title": "Align marketing and sales",
      "tip": "Shared definitions, handoffs, and goals between marketing and sales prevent leads falling through the gap. Misalignment leaks revenue.",
      "takeaway": "Leads die in the gap between marketing and sales. Close it with shared definitions."
    },
    {
      "id": "0640",
      "source": "Digital Strategy",
      "category": "Conversion Copy",
      "title": "Invest in conversion copy",
      "tip": "The words on key pages and buttons heavily influence conversion. Conversion copywriting is high-leverage; invest accordingly.",
      "takeaway": "The right words at the decision point are the cheapest conversion lift available."
    },
    {
      "id": "0641",
      "source": "Digital Strategy",
      "category": "Win-Back Strategy",
      "title": "Plan win-back campaigns",
      "tip": "Lapsed customers already know you and convert cheaper than cold prospects. Build deliberate win-back sequences.",
      "takeaway": "Lapsed customers are warm leads in disguise. Plan to win them back."
    },
    {
      "id": "0642",
      "source": "Digital Strategy",
      "category": "Channel Experiment Budget",
      "title": "Reserve budget for channel experiments",
      "tip": "Always allocate a small portion to testing new channels so you discover the next winner before competitors. All-in on proven channels eventually stalls.",
      "takeaway": "Keep a small bet on the unproven. Today's experiment is tomorrow's main channel."
    },
    {
      "id": "0643",
      "source": "Digital Strategy",
      "category": "Funnel Velocity",
      "title": "Measure and improve funnel velocity",
      "tip": "How fast leads move through the funnel affects cash flow and capacity. Reducing stalls speeds revenue.",
      "takeaway": "A faster funnel turns the same leads into cash sooner. Remove the stalls."
    },
    {
      "id": "0644",
      "source": "Digital Strategy",
      "category": "Strategic Patience",
      "title": "Give compounding strategies time",
      "tip": "SEO, content, brand, and retention pay off slowly then steeply. Abandoning them early forfeits the compounding payoff.",
      "takeaway": "The strategies that compound look like failures right up until they don't. Be patient."
    },
    {
      "id": "0645",
      "source": "Digital Strategy",
      "category": "Conversion Experiments",
      "title": "Run continuous conversion experiments",
      "tip": "Never treat the funnel as finished. Continuous testing of pages, offers, and flows keeps lifting conversion over time.",
      "takeaway": "A funnel is never finished. Keep testing and the conversions keep climbing."
    },
    {
      "id": "0646",
      "source": "Digital Strategy",
      "category": "Customer Data Platform",
      "title": "Unify customer data",
      "tip": "Fragmented data across tools hides the full customer picture. Unifying it enables real personalization and accurate measurement.",
      "takeaway": "Scattered data shows fragments. Unified data shows the customer."
    },
    {
      "id": "0647",
      "source": "Digital Strategy",
      "category": "Acquisition Diversity",
      "title": "Diversify acquisition sources",
      "tip": "Depending on one acquisition channel is fragile. Build several so a single disruption can't halt growth.",
      "takeaway": "One acquisition channel is a single point of failure. Build several."
    },
    {
      "id": "0648",
      "source": "Digital Strategy",
      "category": "Content Authority",
      "title": "Build authority through consistent content",
      "tip": "Regular, genuinely useful content compounds into authority that lowers acquisition cost. Authority is earned by showing up usefully, repeatedly.",
      "takeaway": "Authority is built one useful post at a time, consistently, over a long time."
    },
    {
      "id": "0649",
      "source": "Digital Strategy",
      "category": "Offer Strategy",
      "title": "Engineer irresistible offers",
      "tip": "The offer often matters more than the copy or channel. Invest in making the offer itself compelling before optimizing delivery.",
      "takeaway": "A great offer badly marketed beats a poor offer brilliantly marketed. Fix the offer first."
    },
    {
      "id": "0650",
      "source": "Digital Strategy",
      "category": "Demand Capture vs Creation",
      "title": "Balance demand capture and creation",
      "tip": "Capture existing demand (search, retargeting) for efficiency, create new demand (social, content) for growth. You need both engines.",
      "takeaway": "Harvest the demand that exists, but plant the demand you'll need tomorrow."
    },
    {
      "id": "0651",
      "source": "Digital Strategy",
      "category": "Strategic Review",
      "title": "Review strategy on a cadence",
      "tip": "Markets shift; a strategy set once and never revisited drifts out of relevance. Schedule regular strategic reviews.",
      "takeaway": "A strategy never reviewed is a map of a country that's since changed its borders."
    },
    {
      "id": "0652",
      "source": "Market Research",
      "category": "Research First",
      "title": "Research before you build",
      "tip": "Validate that a market wants what you plan to offer before investing in building it. Research is cheaper than a failed launch.",
      "takeaway": "Cheaper to research the market than to build for one that isn't there."
    },
    {
      "id": "0653",
      "source": "Market Research",
      "category": "TAM SAM SOM",
      "title": "Size TAM, SAM, and SOM",
      "tip": "Total, serviceable, and obtainable market each answer a different question. Confusing them produces fantasy projections.",
      "takeaway": "TAM is the dream, SAM the plan, SOM the promise. Know which you're quoting."
    },
    {
      "id": "0654",
      "source": "Market Research",
      "category": "Top-Down Bottom-Up",
      "title": "Cross-check sizing methods",
      "tip": "Estimate market size top-down and bottom-up; agreement builds confidence, divergence reveals flawed assumptions.",
      "takeaway": "Two methods agreeing gives confidence; disagreeing gives insight. Run both."
    },
    {
      "id": "0655",
      "source": "Market Research",
      "category": "Primary Research",
      "title": "Do primary research, not just desk research",
      "tip": "Talking directly to customers reveals what reports can't. Combine secondary data with your own interviews and surveys.",
      "takeaway": "Reports tell you what's known. Customers tell you what's true. Talk to them."
    },
    {
      "id": "0656",
      "source": "Market Research",
      "category": "Survey Bias",
      "title": "Design surveys to avoid bias",
      "tip": "Leading questions and asking about intentions produce misleading data. Ask about past behavior, neutrally worded.",
      "takeaway": "Ask what they did, not what they'd do. Intentions lie; behavior doesn't."
    },
    {
      "id": "0657",
      "source": "Market Research",
      "category": "Sample Size",
      "title": "Get an adequate sample",
      "tip": "Conclusions from tiny samples are noise dressed as insight. Ensure your sample is large and representative enough to trust.",
      "takeaway": "A handful of responses is an anecdote, not a finding. Get enough."
    },
    {
      "id": "0658",
      "source": "Market Research",
      "category": "Qualitative Depth",
      "title": "Use qualitative research for the why",
      "tip": "Numbers show what happens; interviews and observation reveal why. Pair quantitative scale with qualitative depth.",
      "takeaway": "Stats give you the what. Conversations give you the why. You need both."
    },
    {
      "id": "0659",
      "source": "Market Research",
      "category": "PESTLE",
      "title": "Scan the macro with PESTLE",
      "tip": "Political, Economic, Social, Technological, Legal, and Environmental forces shape your market. Scan them before committing.",
      "takeaway": "The best plan on the wrong macro trend still fails. Scan the field first."
    },
    {
      "id": "0660",
      "source": "Market Research",
      "category": "CAGR",
      "title": "Read growth with CAGR",
      "tip": "Compound annual growth rate smooths noisy year-to-year data into a real trend. One good year is luck; CAGR is a trend.",
      "takeaway": "One strong year is luck. CAGR tells you if it's a movement."
    },
    {
      "id": "0661",
      "source": "Market Research",
      "category": "Segmentation Research",
      "title": "Segment the market with data",
      "tip": "Divide the market into meaningful segments based on real differences in needs and behavior, not convenient demographics.",
      "takeaway": "Segment on what makes customers different, not on what's easy to measure."
    },
    {
      "id": "0662",
      "source": "Market Research",
      "category": "JTBD Research",
      "title": "Research the job, not just the buyer",
      "tip": "Understand the job customers hire products to do. The job is more stable and revealing than demographic profiles.",
      "takeaway": "People don't fit neat segments; their jobs do. Research the job."
    },
    {
      "id": "0663",
      "source": "Market Research",
      "category": "Gap Analysis",
      "title": "Hunt for market gaps",
      "tip": "Look for underserved segments, unmet needs, delivery failures, and pricing-model gaps. Each is an opening to position into.",
      "takeaway": "Find what the market does badly or not at all. That's your opening."
    },
    {
      "id": "0664",
      "source": "Market Research",
      "category": "Competitive Intelligence",
      "title": "Build routine competitive intelligence",
      "tip": "Systematically monitor competitors' public signals \u2014 pricing, ads, reviews, hiring. It's strategy, not espionage.",
      "takeaway": "Everything you need to out-think rivals is usually hiding in plain sight."
    },
    {
      "id": "0665",
      "source": "Market Research",
      "category": "Trend Spotting",
      "title": "Distinguish trends from fads",
      "tip": "A trend reshapes behavior durably; a fad spikes and fades. Invest behind trends; ride fads lightly if at all.",
      "takeaway": "Build on trends, dance with fads. Confusing the two is expensive."
    },
    {
      "id": "0666",
      "source": "Market Research",
      "category": "Customer Interviews",
      "title": "Master the customer interview",
      "tip": "Open-ended, non-leading interviews surface real motivations. Ask about specific past experiences, not hypothetical futures.",
      "takeaway": "'Tell me about the last time you\u2026' reveals more than 'Would you ever\u2026?'"
    },
    {
      "id": "0667",
      "source": "Market Research",
      "category": "Demand Validation",
      "title": "Validate demand with real signals",
      "tip": "Pre-orders, waitlists, and paid pilots prove demand better than enthusiastic survey answers. Seek commitment, not compliments.",
      "takeaway": "A pre-order proves demand; a compliment proves politeness. Seek the first."
    },
    {
      "id": "0668",
      "source": "Market Research",
      "category": "Behavioral Data",
      "title": "Trust behavioral data over stated preference",
      "tip": "What people actually do beats what they say they'll do. Weight observed behavior above stated intention.",
      "takeaway": "Watch the feet, not the mouth. Behavior is the honest survey."
    },
    {
      "id": "0669",
      "source": "Market Research",
      "category": "Niche Sizing",
      "title": "Size the niche realistically",
      "tip": "An exciting niche can be too small to sustain a business. Estimate the obtainable revenue honestly before committing.",
      "takeaway": "Passion for a niche doesn't pay rent. Size the obtainable revenue honestly."
    },
    {
      "id": "0670",
      "source": "Market Research",
      "category": "Research Synthesis",
      "title": "Synthesize research into decisions",
      "tip": "Raw data isn't insight. Distill findings into clear implications and decisions, or the research was just expensive reading.",
      "takeaway": "Research that doesn't change a decision was an expensive way to feel informed."
    },
    {
      "id": "0671",
      "source": "Market Research",
      "category": "Continuous Research",
      "title": "Make research continuous",
      "tip": "Markets shift, so one-time research expires. Build ongoing listening into operations rather than studying the market once.",
      "takeaway": "A market studied once is a market understood briefly. Keep listening."
    },
    {
      "id": "0672",
      "source": "Market Research",
      "category": "Pricing Research",
      "title": "Research willingness to pay",
      "tip": "Test what customers will actually pay through real pricing experiments, not by asking. Stated price tolerance is unreliable.",
      "takeaway": "Asking what someone will pay gives a polite number. Testing gives the real one."
    },
    {
      "id": "0673",
      "source": "Market Research",
      "category": "Competitor Pricing Research",
      "title": "Map competitor pricing systematically",
      "tip": "Understand the full pricing landscape \u2014 tiers, models, discounts \u2014 to position yours intelligently. Price in a vacuum and you misprice.",
      "takeaway": "Know every price in the market before you set yours."
    },
    {
      "id": "0674",
      "source": "Market Research",
      "category": "Review Mining",
      "title": "Mine reviews for insight",
      "tip": "Customer reviews of you and competitors are free, candid research. Read them systematically for needs, complaints, and language.",
      "takeaway": "Reviews are the world's largest free focus group. Read them."
    },
    {
      "id": "0675",
      "source": "Market Research",
      "category": "Search Data",
      "title": "Use search data to read demand",
      "tip": "What people search for reveals real intent and interest at scale. Search trends are an honest, free demand signal.",
      "takeaway": "Search queries are demand confessing itself. Read them."
    },
    {
      "id": "0676",
      "source": "Market Research",
      "category": "Social Listening",
      "title": "Listen to social conversation",
      "tip": "Monitoring what people say online about your category surfaces unmet needs and shifting sentiment. The market talks; listen.",
      "takeaway": "The market is talking online whether you listen or not. Listen."
    },
    {
      "id": "0677",
      "source": "Market Research",
      "category": "Assumption Testing",
      "title": "Test your riskiest assumption first",
      "tip": "Identify the assumption that, if wrong, breaks the whole plan, and test it before anything else. De-risk the foundation first.",
      "takeaway": "Find the assumption that would sink you if wrong, and test that one first."
    },
    {
      "id": "0678",
      "source": "Market Research",
      "category": "Market Timing",

function configuredKeys(){ return state.settings.keys.map((k,i)=>({...k,index:i})).filter(k=>k.key.trim()); }
function hasAnyKey(){ return configuredKeys().length>0; }

async function callGeminiWithKey(prompt, apiKey, opts={}){
  const model = state.settings.model || 'gemini-3.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = {
    contents:[{ parts:[{ text: prompt }] }],
    generationConfig:{ temperature: opts.temperature ?? 0.8, maxOutputTokens: opts.maxTokens ?? 8192 }
  };
  const res = await fetch(url,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if(!res.ok){
    let msg = `HTTP ${res.status}`;
    try { const e = await res.json(); msg = e.error?.message || msg; } catch(_){}
    throw new Error(msg);
  }
  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
  if(!text){
    const fr = data?.candidates?.[0]?.finishReason;
    throw new Error(fr ? `Empty response (${fr})` : 'Empty response from model');
  }
  return text;
}

// Active-key-first, then rotate through the rest. Returns {text, keyLabel}.
async function callGemini(prompt, opts={}){
  const keys = configuredKeys();
  if(!keys.length) throw new Error('No API key set. Add a Gemini key in Settings.');
  const active = state.settings.activeKey ?? 0;
  const ordered = [...keys].sort((a,b)=> (a.index===active?-1:b.index===active?1:0));
  const errs = [];
  for(const k of ordered){
    try {
      const text = await callGeminiWithKey(prompt, k.key, opts);
      return { text, keyLabel:k.label };
    } catch(e){
      errs.push(`${k.label}: ${e.message}`);
      if(opts.onFallback) opts.onFallback(k.label, e.message);
    }
  }
  throw new Error('All keys failed — '+errs.join(' | '));
}

// Forgiving JSON extraction from model output
function parseJSON(text){
  let t = text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
  try { return JSON.parse(t); } catch(_){}
  const a=t.indexOf('['), b=t.lastIndexOf(']'), c=t.indexOf('{'), d=t.lastIndexOf('}');
  // Prefer array if it wraps the whole thing
  if(a!==-1 && b!==-1 && (a<c || c===-1)){
    try { return JSON.parse(t.slice(a,b+1)); } catch(_){}
  }
  if(c!==-1 && d!==-1){
    try { return JSON.parse(t.slice(c,d+1)); } catch(_){}
  }
  // strip trailing commas and retry
  t = t.replace(/,(\s*[}\]])/g,'$1');
  try { return JSON.parse(t); } catch(e){ throw new Error('Could not parse model JSON'); }
}

function ideaKey(s){ return (s==null?'':String(s)).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }

function moreIdeasPrompt(brand, objective, research, existing){

function normalizeMoreIdeas(arr, existing){
  const groups = ['Growth Auditions','Authority Anchors','Personal Relatability','Conversion Mechanics'];
  const seen = new Set((existing||[]).map(it=>ideaKey(it.title)));
  const out = [];
  for(const it of (Array.isArray(arr)?arr:[])){
    if(!it || !it.title) continue;
    const k = ideaKey(it.title);
    if(!k || seen.has(k)) continue;          // drop blanks and duplicates
    seen.add(k);
    out.push({
      group: groups.includes(it.group) ? it.group : 'Conversion Mechanics',
      title: it.title,
      body: it.body || ''
    });
  }
  return out;
}

async function runMoreIdeas(p){
  const ask = ()=>callGemini(moreIdeasPrompt(p.brand,p.objective,p.research,p.ideas), { temperature:0.85, maxTokens:4096, onFallback:(l,m)=>toast(`${l} failed, trying next…`) });
  let fresh = [];
  try {
    const { text } = await ask();
    fresh = normalizeMoreIdeas(parseJSON(text), p.ideas);
  } catch(_){ /* fall through to retry */ }
  // Retry once if the first attempt parsed to nothing usable (truncation / off-format / all duplicates)
  if(fresh.length < 1){
    const { text } = await ask();
    fresh = normalizeMoreIdeas(parseJSON(text), p.ideas);
  }
  if(fresh.length < 1) throw new Error('the model kept repeating existing ideas — try again or regenerate');
  const startN = (p.ideas||[]).reduce((m,it)=>Math.max(m,it.n),0);
  return fresh.slice(0,5).map((it,i)=>({ n: startN + i + 1, ...it }));
}

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Minimal, safe markdown -> HTML (headings, bold, italic, lists, code, hr, tables, blockquote)
function mdToHtml(md){
  if(!md) return '';
  const lines = md.replace(/\r\n/g,'\n').split('\n');
  let html='', inUl=false, inOl=false, inCode=false, codeBuf=[], inTable=false, tableBuf=[];
  const closeLists=()=>{ if(inUl){html+='</ul>';inUl=false;} if(inOl){html+='</ol>';inOl=false;} };
  const inline = (s)=> esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushTable=()=>{
    if(!tableBuf.length){inTable=false;return;}
    const rows = tableBuf.filter(r=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
    html+='<table>';
    rows.forEach((r,ri)=>{
      const cells=r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      html+='<tr>'+cells.map(c=>ri===0?`<th>${inline(c)}</th>`:`<td>${inline(c)}</td>`).join('')+'</tr>';
    });
    html+='</table>'; tableBuf=[]; inTable=false;
  };
  for(let raw of lines){
    const line = raw;
    if(/^```/.test(line)){ if(inCode){ html+=`<pre style="background:#0F0F11;border:1px solid #26262D;border-radius:8px;padding:12px;overflow-x:auto;margin:.6em 0"><code>${esc(codeBuf.join('\n'))}</code></pre>`; codeBuf=[]; inCode=false; } else { closeLists(); inCode=true; } continue; }
    if(inCode){ codeBuf.push(line); continue; }
    if(/^\s*\|.*\|/.test(line)){ if(!inTable){closeLists();inTable=true;} tableBuf.push(line.trim()); continue; }
    else if(inTable){ flushTable(); }
    if(/^\s*#{4}\s+/.test(line)){ closeLists(); html+=`<h4>${inline(line.replace(/^\s*#{4}\s+/,''))}</h4>`; continue; }
    if(/^\s*#{3}\s+/.test(line)){ closeLists(); html+=`<h3>${inline(line.replace(/^\s*#{3}\s+/,''))}</h3>`; continue; }
    if(/^\s*#{2}\s+/.test(line)){ closeLists(); html+=`<h2>${inline(line.replace(/^\s*#{2}\s+/,''))}</h2>`; continue; }
    if(/^\s*#\s+/.test(line)){ closeLists(); html+=`<h1>${inline(line.replace(/^\s*#\s+/,''))}</h1>`; continue; }
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){ closeLists(); html+='<hr>'; continue; }
    if(/^\s*>\s?/.test(line)){ closeLists(); html+=`<blockquote>${inline(line.replace(/^\s*>\s?/,''))}</blockquote>`; continue; }
    if(/^\s*\d+\.\s+/.test(line)){ if(!inOl){closeLists();html+='<ol>';inOl=true;} html+=`<li>${inline(line.replace(/^\s*\d+\.\s+/,''))}</li>`; continue; }
    if(/^\s*[-*]\s+/.test(line)){ if(!inUl){closeLists();html+='<ul>';inUl=true;} html+=`<li>${inline(line.replace(/^\s*[-*]\s+/,''))}</li>`; continue; }
    if(/^\s*$/.test(line)){ closeLists(); continue; }
    closeLists(); html+=`<p>${inline(line)}</p>`;
  }
  if(inTable) flushTable();
  closeLists();
  if(inCode && codeBuf.length) html+=`<pre><code>${esc(codeBuf.join('\n'))}</code></pre>`;
  return html;
}

function downloadFile(name, content, mime='text/plain'){

}

      <p class="text-ivory-300 text-sm mb-5 max-w-md mx-auto">Market King runs on Google Gemini. Add at least one of your five API keys to start analyzing brands.</p>
      <button class="btn btn-gold mx-auto" onclick="go('settings')">Open Settings</button>
    </div>`;
  }
  const p=currentProject();
  if(!p) return renderState1();
  switch(p.stateReached){
    case 2: return renderState2(p);
    case 3: return renderState3(p);
    case 4: return renderState4(p);
    case 5: return renderState5(p);
    default: return renderState1();
  }
}

function exportResearch(){
  const p=currentProject(); if(!p?.research) return;
  exportChooser('Researched Page — '+p.brand, p.research, 'research_'+slug(p.brand));
}
function exportIdeas(){
  const p=currentProject(); if(!p?.ideas) return;
  let md=`# 20 Promotional Ideas — ${p.brand}\n\n**Objective:** ${p.objective}\n\n`;
  const groups=['Growth Auditions','Authority Anchors','Personal Relatability','Conversion Mechanics'];
  for(const g of groups){
    md+=`\n## ${g}\n\n`;
    (p.ideas.filter(it=>it.group===g)).forEach(it=>{ md+=`**${it.n}. ${it.title}**\n\n${it.body}\n\n`; });
  }
  exportChooser('20 Ideas — '+p.brand, md, 'ideas_'+slug(p.brand));
}
function exportPlaybook(fmt){
  const p=currentProject(); const n=p._activeIdea; const md=p.playbooks[n];
  const idea=(p.ideas||[]).find(it=>it.n===n);
  const title=`Playbook — Idea #${n} — ${p.brand}`;
  const fname=`playbook_${n}_${slug(p.brand)}`;
  const full=`# ${idea?.title||'Playbook'}\n\n**Brand:** ${p.brand} · **Objective:** ${p.objective} · **Idea #${n}** (${idea?.group||''})\n\n---\n\n${md}`;
  if(fmt==='html'){ downloadFile(fname+'.html', exportAsHTML(title, full), 'text/html'); toast('HTML exported','success'); }
  else { downloadFile(fname+'.md', full, 'text/markdown'); toast('Markdown exported','success'); }
}
let _pendingExport = null;
function exportChooser(title, md, fname){
  _pendingExport = { title, md, fname };
  openModal(`<div class="p-6">
    <div class="eyebrow mb-2">Export</div>
    <h3 class="font-display text-2xl text-ivory-100 mb-4">${esc(title)}</h3>

      <button class="btn btn-ghost" onclick="doExport('html')">⤓ HTML (dark)</button>
      <button class="btn btn-ghost" onclick="doExport('md')">⤓ Markdown</button>
    </div>

function doExport(fmt){
  if(!_pendingExport) return;
  const { title, md, fname } = _pendingExport;
  if(fmt==='html'){ downloadFile(fname+'.html', exportAsHTML(title, md), 'text/html'); toast('HTML exported','success'); closeModal(); }
  else if(fmt==='md'){ downloadFile(fname+'.md', md, 'text/markdown'); toast('Markdown exported','success'); closeModal(); }
  else if(fmt==='doc'){ downloadFile(fname+'.doc', exportAsWordDoc(title, md), 'application/msword'); toast('Word document exported','success'); closeModal(); }
  else if(fmt==='pdf'){ printHTML(exportAsPrintHTML(title, md)); toast('Opening print → choose Save as PDF','success'); closeModal(); }
}

  const tips=loadTips();
  const f=ui.knowledgeFilter;
  const cats=[...new Set(tips.map(t=>t.category))].sort();
  const sources=[...new Set(tips.map(t=>t.source))].sort();
  let filtered=tips.filter(t=>{
    if(f.cat!=='all'&&t.category!==f.cat) return false;
    if(f.source!=='all'&&t.source!==f.source) return false;
    if(f.readState==='read'&&!state.readTips[t.id]) return false;
    if(f.readState==='unread'&&state.readTips[t.id]) return false;
    if(f.q){ const q=f.q.toLowerCase(); if(!(t.title.toLowerCase().includes(q)||t.tip.toLowerCase().includes(q)||(t.takeaway||'').toLowerCase().includes(q))) return false; }
    return true;
  });
  const readCount = tips.filter(t=>state.readTips[t.id]).length;

  if(tips.length===0){
    return `<div class="fade-in mt-4">
      <div class="mb-4"><div class="eyebrow">Marketing Intelligence</div><h1 class="font-display text-3xl text-ivory-100" style="font-weight:600">Knowledge</h1></div>
      <div class="card p-10 text-center"><div class="text-3xl mb-3 opacity-50">◈</div>
      <p class="text-ivory-300 mb-1">The knowledge library is being built.</p></div></div>`;
  }

  // clamp focus index
  if(ui.focusIdx>=filtered.length) ui.focusIdx=0;
  if(ui.focusIdx<0) ui.focusIdx=filtered.length-1;
  const focus = filtered[ui.focusIdx];

  const navigator = focus ? `
    <div class="card p-5 mb-4" style="border-color:#A8851B;background:linear-gradient(135deg,rgba(201,162,39,.05),transparent)">
      <div class="flex items-center justify-between mb-2">
        <span class="font-mono text-[10px] text-gold-500">${esc(focus.id)} · ${esc(focus.source)}</span>
        <div class="flex items-center gap-2">
          <span class="chip" style="cursor:default">${esc(focus.category)}</span>
          <button onclick="toggleRead('${focus.id}')" title="Mark as read" style="font-size:20px;line-height:1;background:none;border:none;cursor:pointer;color:${state.readTips[focus.id]?'#C9A227':'#33333B'}">${state.readTips[focus.id]?'★':'☆'}</button>
        </div>
      </div>
      <div class="font-display text-2xl text-ivory-100 mb-2" style="font-weight:600">${esc(focus.title)}</div>
      <p class="text-ivory-300 text-sm leading-relaxed mb-3">${esc(focus.tip)}</p>
      ${focus.takeaway?`<div style="border-left:2px solid #C9A227;padding-left:12px;margin-bottom:14px"><p class="text-gold-200 text-sm italic">${esc(focus.takeaway)}</p></div>`:''}
      <div class="flex items-center gap-2 mb-2">
        <button class="btn btn-ghost flex-1" onclick="copyTip('${focus.id}')">⧉ Copy</button>
        <button class="btn btn-gold flex-1" onclick="applyTipModal('${focus.id}')">✦ Apply to a brand</button>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost flex-1" onclick="navTip(-1)">← Prev</button>
        <button class="btn btn-ghost" onclick="navTipRandom()" style="padding:11px 14px" title="Random tip">⤨</button>
        <button class="btn btn-ghost flex-1" onclick="navTip(1)">Next →</button>
      </div>
      <div class="text-center font-mono text-[10px] text-ivory-500 mt-2">${ui.focusIdx+1} of ${filtered.length}</div>
    </div>` : '';

  return `<div class="fade-in mt-4">
    <div class="mb-3"><div class="eyebrow">Marketing Intelligence</div>
      <h1 class="font-display text-3xl text-ivory-100" style="font-weight:600">Knowledge</h1>
      <p class="text-ivory-300 text-sm mt-1">${tips.length} lessons from 12 frameworks${tips.length<1000?' · growing toward 1,000':''} · <span class="text-gold-400">${readCount} read</span></p>
    </div>

    ${navigator}

    <input placeholder="Search tips…" value="${esc(f.q)}" oninput="ui.knowledgeFilter.q=this.value;ui.focusIdx=0;render();const i=document.querySelector('#kq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}" id="kq" class="mb-3">
    <div class="flex gap-1.5 mb-2 overflow-x-auto pb-1" style="scrollbar-width:none">
      <button class="chip ${f.readState==='all'?'chip-active':''}" onclick="ui.knowledgeFilter.readState='all';ui.focusIdx=0;render()">All</button>
      <button class="chip ${f.readState==='unread'?'chip-active':''}" onclick="ui.knowledgeFilter.readState='unread';ui.focusIdx=0;render()">☆ Unread</button>
      <button class="chip ${f.readState==='read'?'chip-active':''}" onclick="ui.knowledgeFilter.readState='read';ui.focusIdx=0;render()">★ Read</button>
    </div>
    <div class="flex gap-1.5 mb-2 overflow-x-auto pb-1" style="scrollbar-width:none">
      <button class="chip ${f.cat==='all'?'chip-active':''}" onclick="ui.knowledgeFilter.cat='all';ui.focusIdx=0;render()">All categories</button>
      ${cats.map(c=>`<button class="chip ${f.cat===c?'chip-active':''}" onclick="ui.knowledgeFilter.cat='${esc(c)}';ui.focusIdx=0;render()">${esc(c)}</button>`).join('')}
    </div>
    <div class="flex gap-1.5 mb-4 overflow-x-auto pb-1" style="scrollbar-width:none">
      <button class="chip ${f.source==='all'?'chip-active':''}" onclick="ui.knowledgeFilter.source='all';ui.focusIdx=0;render()">All sources</button>
      ${sources.map(s=>`<button class="chip ${f.source===s?'chip-active':''}" onclick="ui.knowledgeFilter.source='${esc(s)}';ui.focusIdx=0;render()">${esc(s)}</button>`).join('')}
    </div>
    <div class="font-mono text-[10px] text-ivory-500 uppercase tracking-wider mb-2">${filtered.length} result${filtered.length===1?'':'s'} · tap a card to focus it above</div>
    <div class="space-y-2">
      ${filtered.slice(0,300).map((t,idx)=>`<div class="card ${idx===ui.focusIdx?'':''} p-4" style="${idx===ui.focusIdx?'border-color:#A8851B':''}">
        <div class="flex items-start gap-2 mb-1">
          <span class="font-mono text-[10px] text-gold-500 pt-0.5">${esc(t.id||'')}</span>
          <div class="flex-1 cursor-pointer" onclick="focusTip(${idx})"><div class="text-ivory-100 font-semibold text-[15px]">${esc(t.title)}</div></div>
          <button onclick="copyTip('${t.id}')" title="Copy tip" style="font-size:14px;line-height:1;background:none;border:none;cursor:pointer;color:#5b5750" onmouseover="this.style.color='#C9A227'" onmouseout="this.style.color='#5b5750'">⧉</button>
          <button onclick="toggleRead('${t.id}')" title="Mark as read" style="font-size:17px;line-height:1;background:none;border:none;cursor:pointer;color:${state.readTips[t.id]?'#C9A227':'#33333B'}">${state.readTips[t.id]?'★':'☆'}</button>
        </div>
        <p class="text-ivory-300 text-sm leading-relaxed mb-2 cursor-pointer" onclick="focusTip(${idx})">${esc(t.tip)}</p>
        ${t.takeaway?`<div style="border-left:2px solid #C9A227;padding-left:10px"><p class="text-gold-200 text-sm italic">${esc(t.takeaway)}</p></div>`:''}
        <div class="font-mono text-[9px] text-ivory-500 uppercase tracking-wider mt-2">${esc(t.source)} · ${esc(t.category)}</div>
      </div>`).join('')}
    </div>
    ${filtered.length>300?`<p class="text-center text-ivory-500 text-sm mt-3 font-mono">Showing first 300 — refine your search</p>`:''}
  </div>`;
}
function toggleRead(id){ if(state.readTips[id]) delete state.readTips[id]; else state.readTips[id]=true; saveState(); render(); }
function navTip(dir){ ui.focusIdx+=dir; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function navTipRandom(){
  const tips=loadTips(); const f=ui.knowledgeFilter;
  const filtered=tips.filter(t=>{
    if(f.cat!=='all'&&t.category!==f.cat) return false;
    if(f.source!=='all'&&t.source!==f.source) return false;
    if(f.readState==='read'&&!state.readTips[t.id]) return false;
    if(f.readState==='unread'&&state.readTips[t.id]) return false;
    if(f.q){ const q=f.q.toLowerCase(); if(!(t.title.toLowerCase().includes(q)||t.tip.toLowerCase().includes(q)||(t.takeaway||'').toLowerCase().includes(q))) return false; }
    return true;
  });
  if(filtered.length<=1) return;
  let r; do { r=Math.floor(Math.random()*filtered.length); } while(r===ui.focusIdx);
  ui.focusIdx=r; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function focusTip(idx){ ui.focusIdx=idx; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function tipById(id){ return loadTips().find(t=>t.id===id); }
function copyTip(id){
  const t=tipById(id); if(!t) return;
  const text=`${t.title}\n\n${t.tip}${t.takeaway?`\n\nTakeaway: ${t.takeaway}`:''}\n\n— ${t.source} · ${t.category} · Market King`;
  const done=()=>toast('Tip copied','success');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed','error'); }
  ta.remove();
}

function applyTipModal(id){
  const t=tipById(id); if(!t) return;
  const projs=Object.values(state.projects).sort((a,b)=>b.updatedAt-a.updatedAt);
  const cur=currentProject();
  openModal(`<div class="p-6">
    <div class="eyebrow mb-1">Apply Tip</div>
    <h3 class="font-display text-2xl text-ivory-100 mb-1">${esc(t.title)}</h3>
    <p class="text-ivory-500 text-xs font-mono uppercase tracking-wider mb-4">${esc(t.source)} · ${esc(t.category)}</p>
    <p class="text-ivory-300 text-sm mb-4">Ask the engine to apply this lesson to a specific brand or product.</p>
    ${projs.length?`<div class="font-mono text-[10px] text-ivory-500 uppercase tracking-wider mb-1.5">Use a saved project</div>
    <select id="apply-proj" onchange="document.getElementById('apply-brand').value=this.value==='__custom'?'':this.options[this.selectedIndex].text">
      ${projs.map(p=>`<option value="${esc(p.brand)}" ${cur&&cur.id===p.id?'selected':''}>${esc(p.brand)}</option>`).join('')}
      <option value="__custom">— Type a different brand —</option>
    </select>
    <div class="font-mono text-[10px] text-ivory-500 uppercase tracking-wider mb-1.5 mt-3">Brand / product</div>`:`<div class="font-mono text-[10px] text-ivory-500 uppercase tracking-wider mb-1.5">Brand / product</div>`}
    <input id="apply-brand" placeholder="e.g. my coffee shop, a SaaS app…" value="${cur?esc(cur.brand):''}">
    <div id="apply-out" class="mt-4"></div>
    <div class="flex gap-2 mt-4">
      <button class="btn btn-ghost flex-1" onclick="closeModal()">Close</button>
      <button class="btn btn-gold flex-1" id="apply-go" onclick="runApplyTip('${id}')">✦ Apply Tip</button>
    </div>
  </div>`);
  setTimeout(()=>{ const i=document.getElementById('apply-brand'); if(i&&!i.value) i.focus(); },50);
}

function applyTipPrompt(tip, brand){
  return `You are Market King, a marketing strategist. Apply the single marketing lesson below to the specific brand/product, concretely and actionably.

LESSON: ${tip.title}
${tip.tip}
${tip.takeaway?`Key takeaway: ${tip.takeaway}`:''}
(Source framework: ${tip.source} — ${tip.category})

BRAND / PRODUCT: ${brand}

Give a focused, practical answer in MARKDOWN with these parts:
- **How it applies** — 2-3 sentences on what this lesson means specifically for ${brand}.
- **Do this** — 3-5 concrete, deployable actions tailored to ${brand}.
- **Example** — one real example (a sample headline, post, offer, or move) showing the lesson in action for ${brand}.

Be specific to ${brand}. No generic filler. Return ONLY the markdown.`;
}
async function runApplyTip(id){
  const t=tipById(id); if(!t) return;
  const brand=(document.getElementById('apply-brand').value||'').trim();
  if(!brand){ toast('Enter a brand or product','error'); return; }
  if(!hasAnyKey()){ toast('Add a Gemini key in Settings first','error'); return; }
  const out=document.getElementById('apply-out');
  const btn=document.getElementById('apply-go');
  if(btn){ btn.disabled=true; }
  out.innerHTML=`<div class="card p-5 text-center"><div class="spinner mx-auto mb-2"></div><p class="text-ivory-500 text-sm font-mono">Applying to ${esc(brand)}…</p></div>`;
  try{
    const { text }=await callGemini(applyTipPrompt(t,brand), { temperature:0.7, maxTokens:2048, onFallback:(l,m)=>toast(`${l} failed, trying next…`) });
    _pendingExport={ title:`${t.title} — applied to ${brand}`, md:text, fname:'tip_'+slug(brand) };
    out.innerHTML=`<div class="card p-5 prose-gold" style="max-height:50vh;overflow-y:auto">${mdToHtml(text)}</div>
      <div class="grid grid-cols-3 gap-2 mt-3">
        <button class="btn btn-ghost" onclick="copyApplied()">⧉ Copy</button>
        <button class="btn btn-ghost" onclick="doExport('pdf')">⤓ PDF</button>
        <button class="btn btn-ghost" onclick="doExport('doc')">⤓ Word</button>
        <button class="btn btn-ghost" onclick="doExport('md')">⤓ MD</button>
        <button class="btn btn-ghost" onclick="doExport('html')">⤓ HTML</button>
      </div>`;
  }catch(e){
    out.innerHTML=`<div class="card p-4"><p class="text-sm" style="color:#d98a8a">Failed: ${esc(e.message)}</p></div>`;
  }
  if(btn){ btn.disabled=false; }
}
function copyApplied(){
  const text=_pendingExport?_pendingExport.md:'';
  if(!text) return;
  const done=()=>toast('Copied','success');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  else fallbackCopy(text,done);
}

/* ====================================================================
   SECTION J — SETTINGS VIEW (3 keys + model)
   ==================================================================== */
function renderSettings(){
  const s=state.settings;
  return `<div class="fade-in mt-4">
    <div class="mb-5"><div class="eyebrow">Configuration</div><h1 class="font-display text-3xl text-ivory-100" style="font-weight:600">Settings</h1></div>

    <div class="card p-5 mb-4">
      <h3 class="font-display text-xl text-ivory-100 mb-1" style="font-weight:600">Gemini API Keys</h3>
      <p class="text-ivory-300 text-sm mb-4">Five independent slots. The <span class="text-gold-400">active</span> key is used first; the others auto-cover if it fails. Free keys at <span class="font-mono text-gold-400">aistudio.google.com/apikey</span></p>
      ${s.keys.map((k,i)=>{
        const active=s.activeKey===i;
        return `<div class="mb-3 p-3 rounded-lg border ${active?'border-gold-600':'border-coal-700'}" style="${active?'background:rgba(201,162,39,.05)':''}">
          <div class="flex items-center justify-between mb-2 gap-2">
            <div class="flex items-center gap-2 flex-1 min-w-0">
              <button onclick="setActiveKey(${i})" title="Make active" style="width:14px;height:14px;border-radius:50%;border:2px solid ${active?'#C9A227':'#33333B'};background:${active?'#C9A227':'transparent'};flex-shrink:0;cursor:pointer"></button>
              <input value="${esc(k.label)}" onchange="setKeyLabel(${i},this.value)" style="font-family:'JetBrains Mono';font-size:12px;padding:5px 8px;max-width:160px" placeholder="Label">
              ${active?'<span class="font-mono text-[9px] uppercase tracking-wider text-gold-400 px-1.5 py-0.5 rounded" style="background:rgba(201,162,39,.12)">Active</span>':''}
            </div>
            <span class="font-mono text-[10px] ${k.key?'text-gold-400':'text-ivory-500'}">${k.key?'● set':'○ empty'}</span>
          </div>
          <input type="password" value="${esc(k.key)}" placeholder="AIza…" onchange="setKey(${i},this.value)" style="margin-bottom:6px">
          <div class="flex gap-1.5">
            <button class="btn btn-ghost" style="padding:6px 12px;font-size:10px" onclick="testKey(${i})">Test</button>
            ${k.key?`<button class="btn btn-ghost" style="padding:6px 12px;font-size:10px" onclick="setKey(${i},'');render()">Clear</button>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="card p-5 mb-4">
      <h3 class="font-display text-xl text-ivory-100 mb-3" style="font-weight:600">Model</h3>
      ${(()=>{
        const known = GEMINI_MODELS.some(m=>m.id===s.model);
        const isCustom = !known;
        const note = known ? (GEMINI_MODELS.find(m=>m.id===s.model)||{}).note : '';
        return `<select onchange="onModelSelect(this.value)">
        ${GEMINI_MODELS.map(m=>`<option value="${m.id}" ${s.model===m.id?'selected':''}>${m.label}</option>`).join('')}
        <option value="__custom__" ${isCustom?'selected':''}>Custom model…</option>
      </select>
      ${note?`<p class="text-ivory-500 text-xs mt-2">${esc(note)}</p>`:''}
      ${isCustom?`<input class="mt-2" placeholder="e.g. gemini-3.1-pro-latest" value="${esc(s.model||'')}" oninput="state.settings.model=this.value.trim();saveState()">
      <p class="text-ivory-500 text-xs mt-1">Enter the exact API model id. Use this if Google's identifier differs from the presets, or to try a newer model.</p>`:''}`;
      })()}
    </div>

    <div class="card p-5">
      <h3 class="font-display text-xl text-ivory-100 mb-2" style="font-weight:600">Data</h3>
      <p class="text-ivory-300 text-sm mb-3">${Object.keys(state.projects).length} project(s) saved in this browser.</p>
      <button class="btn btn-danger w-full" onclick="wipeData()">Wipe all data</button>
    </div>
  </div>`;
}
function setActiveKey(i){ state.settings.activeKey=i; saveState(); render(); }
function setKeyLabel(i,v){ state.settings.keys[i].label=v.trim()||('Key '+(i+1)); saveState(); }
function setKey(i,v){ state.settings.keys[i].key=v.trim(); saveState(); }
async function testKey(i){
  const k=state.settings.keys[i];
  if(!k.key){ toast('Add a key first','error'); return; }
  toast(`Testing ${k.label}…`);
  try{ const t=await callGeminiWithKey('Reply with exactly: OK', k.key, {temperature:0,maxTokens:16}); toast(`${k.label} works ✓`,'success'); }
  catch(e){ toast(`${k.label}: ${e.message}`,'error'); }
}
function wipeData(){
  openModal(`<div class="p-6 text-center"><div class="text-2xl mb-2">⚠</div>
    <h3 class="font-display text-xl text-ivory-100 mb-2">Wipe everything?</h3>
    <p class="text-ivory-300 text-sm mb-4">All projects and keys will be deleted from this browser.</p>
    <div class="flex gap-2"><button class="btn btn-ghost flex-1" onclick="closeModal()">Cancel</button>
    <button class="btn btn-danger flex-1" onclick="(function(){localStorage.removeItem(STORE_KEY);state=defaultState();closeModal();go('engine');toast('Wiped');})()">Wipe All</button></div></div>`);
}

/* ====================================================================
   SECTION K — INIT
   ==================================================================== */
render();
</script>
</body>
</html>
